name: Tests

on:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # --ignore-scripts skips postinstall, and the route tests' build needs the tsconfig files.
            - name: Prepare Nuxt
              run: npx nuxt prepare apps/web

            - name: Run tests
              run: npm test
